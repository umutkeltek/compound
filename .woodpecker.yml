when:
  - event: [manual, cron]
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: pull_request

steps:
  proof-gates:
    image: docker.io/library/golang:1.26.4-bookworm
    environment:
      GOCACHE: /tmp/compound-go-cache
      GOMODCACHE: /tmp/compound-go-mod
      HOME: /tmp/compound-ci-home
    backend_options:
      docker:
        user: "1000:1000"
    commands:
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - mkdir -p .ci/bin
      - go build -o .ci/bin/compound ./cmd/compound
      - .ci/bin/compound proof-check --ci

  console-gates:
    image: docker.io/oven/bun:1.3.9-debian
    depends_on:
      - proof-gates
    commands:
      - (cd console && bun install --frozen-lockfile)
      - COMPOUND_BIN="$CI_WORKSPACE/.ci/bin/compound" .ci/bin/compound proof-check --ci-console

  secret-scan:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1
    depends_on:
      - console-gates
    commands:
      - gitleaks dir . --config .gitleaks.toml --no-banner --redact
