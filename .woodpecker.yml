when:
  - event: [manual, cron]
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: pull_request

steps:
  prepare-bun:
    image: docker.io/oven/bun:1.3.9-debian
    backend_options:
      docker:
        user: "1000:1000"
    commands:
      - mkdir -p .ci/bin
      - cp "$(command -v bun)" .ci/bin/bun
      - chmod 0755 .ci/bin/bun

  proof-gates:
    image: docker.io/library/golang:1.27.2-bookworm
    depends_on:
      - prepare-bun
    environment:
      GOCACHE: /cache/go-build
      GOMODCACHE: /cache/go-mod
      HOME: /tmp/compound-ci-home
    volumes:
      - compound-go-build-cache:/cache/go-build
      - compound-go-mod-cache:/cache/go-mod
    # The container starts as root only to place the fixed-path Node
    # interpreter (/usr/bin/node, needed by the harness suite) and to own the
    # fresh named cache volumes; the gates themselves run as an unprivileged
    # user via setpriv, because the suite injects permission failures that
    # root cannot observe (pipeline 551). Nothing here touches the agent host.
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends nodejs >/dev/null
      - test -x /usr/bin/node && /usr/bin/node --version
      - mkdir -p "$HOME" "$GOCACHE" "$GOMODCACHE"
      # ssh-keygen and other tools look the running uid up in passwd; give uid
      # 1000 an entry so the unprivileged gates behave like a real user account.
      - getent passwd 1000 >/dev/null || useradd --uid 1000 --no-create-home --home-dir "$HOME" --shell /bin/sh ci
      # The clone is group-writable (umask 002). Runtime capture custody refuses
      # group- or world-writable parent directories by design, and its tests
      # build fixtures inside the checkout (pipeline 580). Match a umask-022
      # developer checkout instead of relaxing that check.
      - chmod -R go-w "$CI_WORKSPACE"
      - chown -R 1000:1000 "$HOME" "$GOCACHE" "$GOMODCACHE" "$CI_WORKSPACE"
      - |
        setpriv --reuid=1000 --regid=1000 --clear-groups \
          env HOME="$HOME" GOCACHE="$GOCACHE" GOMODCACHE="$GOMODCACHE" \
              PATH="$CI_WORKSPACE/.ci/bin:$PATH" \
              GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$CI_WORKSPACE" \
          sh -euc '
            git config --global --add safe.directory "$CI_WORKSPACE"
            mkdir -p .ci/bin
            go build -o .ci/bin/compound ./cmd/compound
            .ci/bin/compound proof-check --ci
          '

  # Node 22 runs the console smokes that use --experimental-strip-types and
  # node:test (the bun image's node is a bun wrapper), and its image has the
  # git that fixture seeding calls. Bun is the pinned copy from prepare-bun.
  console-gates:
    image: docker.io/library/node:22-bookworm
    depends_on:
      - proof-gates
    backend_options:
      docker:
        user: "1000:1000"
    commands:
      - |
        set -eu
        export PATH="$CI_WORKSPACE/.ci/bin:$PATH"
        export COMPOUND_BIN="$CI_WORKSPACE/.ci/bin/compound"
          # A global test home must stay outside the source checkout.
          COMPOUND_HOME="$(mktemp -d /tmp/compound-ci-console.XXXXXX)"
        export COMPOUND_HOME
        "$COMPOUND_BIN" home init
        export CONSOLE_SMOKE_REQUIRE_CLI=1
        (cd console && bun install --frozen-lockfile)
        mkdir -p "$CI_WORKSPACE/.ci/reports"
        report="$CI_WORKSPACE/.ci/reports/ci-console.json"
        # The full JSON is retained in owned CI logs as well as this report.
        "$COMPOUND_BIN" proof-check --ci-console --json --out "$report"
        node --input-type=module - "$report" <<'NODE'
        import assert from "node:assert/strict";
        import { readFileSync } from "node:fs";
        import { createHash } from "node:crypto";
        const bytes = readFileSync(process.argv[2]);
        const report = JSON.parse(bytes);
        assert.equal(report.status, "ok");
        assert.equal(report.dry_run, false);
        assert.ok(report.steps.length > 0);
        assert.ok(report.steps.every((step) => step.status === "ok"), "every console gate must execute successfully, with no skips");
        const required = [
          ["console-projection-doors-smoke", /real CLI work-detail IDs.*round-trip ok/],
          ["console-standing-law-smoke", /standing-law e2e ok:/],
        ];
        for (const [name, marker] of required) {
          const step = report.steps.find((item) => item.name === name);
          assert.equal(step?.status, "ok", `${name} must run`);
          assert.match(step.output_tail ?? "", marker, `${name} must run its CLI-backed integration`);
        }
        console.log(JSON.stringify({ ci_console_required_cli: true, passed: report.steps.length, skipped: 0, report_sha256: createHash("sha256").update(bytes).digest("hex"), required_cli_gates: required.map(([name]) => name) }));
        NODE
        rm -f .ci/bin/bun

  secret-scan:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1
    depends_on:
      - console-gates
    commands:
      - gitleaks dir . --config .gitleaks.toml --no-banner --redact
      - |
        if [ "$CI_PIPELINE_EVENT" = manual ] && [ -n "${RELEASE_VERSION:-}" ]; then
          source="$CI_WORKSPACE/.ci/release-source"
          test ! -e "$source" && test ! -L "$source" || { echo "release source already exists; refusing reuse" >&2; exit 1; }
        fi

  # Woodpecker supplies checkout credentials only to trusted clone images.
  # A fresh full clone keeps those credentials out of release-build and the workspace.
  release-history:
    image: docker.io/woodpeckerci/plugin-git:2.9.0@sha256:1e536c0da16f8cbb35e870fb3d75fde45c85c7239225fea2209cc6990ba330e4
    depends_on: [secret-scan]
    when:
      - event: manual
        evaluate: 'RELEASE_VERSION != ""'
    settings:
      path: ${CI_WORKSPACE}/.ci/release-source
      ref: refs/heads/main
      partial: false
      depth: 0
      tags: false
      recursive: false
      # Decimal 18 is octal 022. Credentials remain in the container's /root.
      umask: 18
      home: /root

  release-build:
    image: docker.io/library/golang:1.27.2-bookworm
    depends_on: [release-history]
    when:
      - event: manual
        evaluate: 'RELEASE_VERSION != ""'
    environment:
      GOCACHE: /cache/go-build
      GOMODCACHE: /cache/go-mod
      HOME: /tmp/compound-ci-home
    volumes:
      - compound-go-build-cache:/cache/go-build
      - compound-go-mod-cache:/cache/go-mod
    commands:
      - mkdir -p "$HOME" "$GOCACHE" "$GOMODCACHE"
      # ssh-keygen and other tools look the running uid up in passwd; give uid
      # 1000 an entry so the unprivileged gates behave like a real user account.
      - getent passwd 1000 >/dev/null || useradd --uid 1000 --no-create-home --home-dir "$HOME" --shell /bin/sh ci
      - chown -R 1000:1000 "$HOME" "$GOCACHE" "$GOMODCACHE" "$CI_WORKSPACE"
      - |
        setpriv --reuid=1000 --regid=1000 --clear-groups \
          env HOME="$HOME" GOCACHE="$GOCACHE" GOMODCACHE="$GOMODCACHE" \
              GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$CI_WORKSPACE" \
          bash -euo pipefail -c '
            test "$CI_PIPELINE_EVENT" = manual
            test -n "$RELEASE_VERSION"
            version_re="^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$"
            [[ "$RELEASE_VERSION" =~ $version_re ]] || { echo "RELEASE_VERSION must be strict stable SemVer" >&2; exit 1; }
            source="$CI_WORKSPACE/.ci/release-source"
            test -d "$source/.git" && test ! -L "$source"
            cd "$source"
            test "$(git rev-parse --is-shallow-repository)" = false
            test "$(git remote get-url origin)" = "$CI_REPO_CLONE_URL" || { echo "release source origin mismatch" >&2; exit 1; }
            main_sha=$(git rev-parse refs/remotes/origin/main)
            test "$CI_COMMIT_SHA" = "$main_sha" || { echo "candidate must equal the exact origin/main tip" >&2; exit 1; }
            test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"
            root="$CI_WORKSPACE/.ci/release"
            mkdir "$root"
            go mod verify
            # Each step is a fresh container and export-public needs a home; keep it outside the checkout.
            release_home="$(mktemp -d /tmp/compound-release-home.XXXXXX)"
            COMPOUND_HOME="$release_home" "$CI_WORKSPACE/.ci/bin/compound" home init
            COMPOUND_HOME="$release_home" "$CI_WORKSPACE/.ci/bin/compound" release export-public --repo "$source" --target "$root/compound-public-source.tar.gz" --prefix compound-source --json
            test -s "$root/compound-public-source.tar.gz"
            tar -tzf "$root/compound-public-source.tar.gz" >/dev/null
            mkdir "$root/tools"
            GOBIN="$root/tools" go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
            for build in a b; do
              VERSION="$RELEASE_VERSION" SOURCE_ROOT="$source" DIST="$root/$build" SBOM_TOOL="$root/tools/cyclonedx-gomod" go run ./scripts/release-artifacts.go
            done
            cmp "$root/a/SHA256SUMS" "$root/b/SHA256SUMS"
            names=(RELEASE SHA256SUMS install-release.sh)
            for platform in darwin_arm64 linux_amd64; do
              names+=("compound_$RELEASE_VERSION"_"$platform.tar.gz" "compound_$RELEASE_VERSION"_"$platform.cdx.json" "compound_$RELEASE_VERSION"_"$platform"_compound-breadth-engine.cdx.json)
            done
            for build in a b; do
              test "$(find "$root/$build" -mindepth 1 -maxdepth 1 -print | wc -l)" -eq 9
              for name in "$${names[@]}"; do
                test -f "$root/$build/$name" && test ! -L "$root/$build/$name"
                cmp "$root/a/$name" "$root/b/$name"
              done
              (cd "$root/$build" && sha256sum --check SHA256SUMS)
            done
            # A real parent generation exercises rollback even before a first publication.
            prior_commit=$(git rev-parse HEAD~1)
            printf "%s\n" "$prior_commit" > "$root/PRIOR_COMMIT"
            git clone --shared --no-checkout "$source" "$root/prior-source"
            git archive "$prior_commit" | tar -xf - -C "$root/prior-source"
            git -C "$root/prior-source" reset --mixed "$prior_commit"
            prior_version=$(cd "$root/prior-source" && go run ./cmd/compound version | cut -d " " -f 2)
            VERSION="$prior_version" SOURCE_ROOT="$root/prior-source" DIST="$root/prior" SBOM_TOOL="$root/tools/cyclonedx-gomod" go run ./scripts/release-artifacts.go
          '

  release-linux-drill:
    image: docker.io/library/node:22-bookworm
    depends_on: [release-build]
    when:
      - event: manual
        evaluate: 'RELEASE_VERSION != ""'
    backend_options:
      docker:
        user: "1000:1000"
    environment:
      HOME: /tmp/compound-release-drill-home
    commands:
      - |
        set -eu
        test "$CI_PIPELINE_EVENT" = manual
        test -n "$RELEASE_VERSION"
        mkdir -p "$HOME"
        root="$CI_WORKSPACE/.ci/release"
        install_root=$(mktemp -d)
        COMPOUND_RELEASE_TARBALL="$root/a/compound_$RELEASE_VERSION"_linux_amd64.tar.gz \
          COMPOUND_HOME="$install_root/home" GOBIN="$install_root/bin" sh "$root/a/install-release.sh"
        test "$("$install_root/bin/compound" version)" = "compound $RELEASE_VERSION (build $CI_COMMIT_SHA)"
        test -x "$install_root/bin/compound-breadth-engine"
        # home doctor refuses a home inside a Git checkout, so run outside the workspace and keep the report.
        acceptance="$(mktemp -d /tmp/compound-release-acceptance.XXXXXX)/run"
        acceptance_status=0
        node scripts/installed-release-acceptance.mjs "$root/a" "$CI_COMMIT_SHA" \
          "$acceptance" "$root/prior" "$(cat "$root/PRIOR_COMMIT")" || acceptance_status=$?
        cp "$acceptance/installed-acceptance.json" "$root/linux-acceptance.json" || true
        exit "$acceptance_status"

  release-stage:
    image: docker.io/library/node:22-bookworm
    depends_on: [release-linux-drill]
    when:
      - event: manual
        evaluate: 'RELEASE_VERSION != ""'
    backend_options:
      docker:
        user: "1000:1000"
    volumes:
      - /srv/appdata/woodpecker/releases:/releases
    commands:
      - |
        set -eu
        test "$(id -u)" -ne 0
        test "$CI_PIPELINE_EVENT" = manual
        test -n "$RELEASE_VERSION"
        printf '%s\n' "$RELEASE_VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
        candidate="$CI_WORKSPACE/.ci/release/a"
        destination="/releases/$RELEASE_VERSION"
        # mkdir is exclusive: existing directories and symlinks are never retried in place.
        mkdir "$destination" || { echo "release candidate already exists or stage is unavailable; operator must inspect it" >&2; exit 1; }
        test "$(find "$candidate" -mindepth 1 -maxdepth 1 -print | wc -l)" -eq 9
        (cd "$candidate" && sha256sum --check SHA256SUMS)
        for file in "$candidate"/*; do
          test -f "$file" && test ! -L "$file"
          cp "$file" "$destination/"
        done
        (cd "$destination" && sha256sum --check SHA256SUMS)
        sums_sha=$(sha256sum "$destination/SHA256SUMS" | cut -d ' ' -f 1)
        # Written last; an interrupted copy is not a complete candidate.
        printf 'version %s\ncommit %s\npipeline %s\nsha256sums_sha256 %s\n' \
          "$RELEASE_VERSION" "$CI_COMMIT_SHA" "$CI_PIPELINE_NUMBER" "$sums_sha" > "$destination/CANDIDATE"
