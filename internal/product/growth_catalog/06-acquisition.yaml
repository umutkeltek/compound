areas:
  - id: acquisition_channels
    group: acquisition
    title: Where to find users
    question: Have we picked the few channels most likely to reach our users?
    measure: channel choice
    skills: [product-marketing]
    evidence:
      record: [channels]
  - id: acquisition_search
    group: acquisition
    title: Search visibility
    question: Do people find the product when they search?
    measure: search discoverability
    skills: [seo-audit]
    kinds:
      ios_app:
        title: App Store search
        question: Do people find the app when they search the store?
        measure: App Store search
        evidence:
          metrics: [app_store_connect_impressions]
          source: App Store Connect analytics
        skills: [aso]
      website:
        title: Search engines
        question: Do people find the site when they search the web?
        measure: web search traffic
        evidence:
          metrics: ["gsc_*"]
          source: Search Console
          custom: web_traffic
        skills: [seo-audit, ai-seo]
      web_app:
        title: Search engines
        question: Do people find the product when they search the web?
        measure: web search traffic
        evidence:
          metrics: ["gsc_*"]
          source: Search Console
          custom: web_traffic
        skills: [seo-audit, ai-seo]
  - id: acquisition_listing
    group: acquisition
    title: Product listing
    question: Does the product's listing turn visitors into users?
    measure: listing conversion
    kinds:
      ios_app:
        title: App Store product page
        question: Do visitors to the product page download the app?
        measure: product page conversion
        evidence:
          metrics: [app_store_product_page_conversion, app_store_connect_product_page_views, app_store_connect_first_time_downloads, app.conversion_rate]
          companion: [app_store_connect_product_page_views, app_store_connect_first_time_downloads]
          source: App Store Connect analytics
        skills: [aso, app-store-screenshots]
      website:
        title: Directory listings
        question: Is the site listed where people look for sites like it?
        measure: directory listings
        skills: [directory-submissions]
      web_app:
        title: Directory listings
        question: Is the product listed where people look for tools like it?
        measure: directory listings
        skills: [directory-submissions]
  - id: acquisition_landing
    group: acquisition
    title: Website visitors
    question: Do people who reach the site take the next step?
    measure: website traffic
    skills: [cro, copywriting]
    evidence:
      metrics: ["ga4_*"]
      source: Google Analytics
  - id: acquisition_organic
    group: acquisition
    title: Reach from posts
    question: Do posts and content bring people to the product?
    measure: organic distribution
    evidence:
      metrics: [content_posts]
      source: content post records
      custom: organic
  - id: acquisition_paid
    group: acquisition
    title: Paid ads
    question: Does paid advertising bring in users at a fair price?
    measure: paid advertising
    needs: [operations_unit_economics, acquisition_attribution]
    evidence:
      metrics: [ads_spend]
      source: ads import
      custom: search_ads
    kinds:
      ios_app:
        title: Apple Search Ads
        question: Does paid search bring in installs at a fair price?
        measure: paid search
        evidence:
          metrics: [apple_search_ads_spend]
          source: Apple Search Ads import
          custom: search_ads
  - id: acquisition_community
    group: acquisition
    title: Community
    question: Is there a place where users talk with us and with each other?
    measure: community
    kinds:
      api:
        title: Developer community
        question: Do developers get help and share their work in a community we take part in?
        measure: developer community
      dev_tool:
        title: Developer community
        question: Do developers get help and share their work in a community we take part in?
        measure: developer community
  - id: acquisition_partnerships
    group: acquisition
    title: Partners and integrations
    question: Do partners, affiliates or integrations bring us new users?
    measure: partnerships
  - id: acquisition_launches
    group: acquisition
    title: Launches and press
    question: Do launches and press bring a clear jump in new users?
    measure: launches and press
    skills: [launch, directory-submissions]
  - id: acquisition_attribution
    group: acquisition
    title: Where new users come from
    question: Do we know which channel brought each new user, and what it cost?
    measure: where new users come from
    needs: [analytics_instrumentation]
    evidence:
      capped: [ads_conversions]
      source: ads import
